name: avafli_example
description: Example app demonstrating Avafli Flutter SDK integration
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Avafli Flutter SDK - using local path for development
  avafli_sdk:
    path: ../

  # UI and styling
  cupertino_icons: ^1.0.2

  # Demo-only: used by the "reset demo state" affordance to clear the SDK's
  # once-per-day auto-present bookkeeping.
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Example fonts (if needed)
  # fonts:
  #   - family: AvafliFont
  #     fonts:
  #       - asset: fonts/AvafliFont-Regular.ttf
  #       - asset: fonts/AvafliFont-Bold.ttf
  #         weight: 700
