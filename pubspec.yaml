name: winr_flutter_sdk
description: >
  WINR Flutter SDK — A sweepstakes and engagement SDK for Flutter apps.
  Add daily streaks, rewarded video entries, and sweepstakes campaigns
  to your app with a few lines of code.
version: 1.0.0
homepage: https://avafli-website.web.app/sdk
repository: https://github.com/AVAFLI/winr_flutter_sdk

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  geolocator: ^14.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
