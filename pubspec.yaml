name: winr_flutter_sdk
description: >
  WINR Flutter SDK — A sweepstakes and engagement SDK for Flutter apps.
  Add daily streaks, rewarded video entries, and sweepstakes campaigns
  to your app with a few lines of code.
version: 1.0.0
homepage: https://avafli-website.web.app/sdk
repository: https://github.com/AVAFLI/winr_flutter_sdk

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.1
  http: ^1.6.0
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  shared_preferences: ^2.5.4
  device_info_plus: ">=10.0.0 <14.0.0"
  package_info_plus: ">=8.0.0 <11.0.0"
  connectivity_plus: ">=6.0.0 <9.0.0"
  geolocator: ">=13.0.0 <16.0.0"
  crypto: ^3.0.7
  url_launcher: ">=6.2.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
