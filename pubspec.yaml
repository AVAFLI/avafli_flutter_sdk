name: avafli_sdk
description: >
  Avafli Engagement SDK for Flutter — add daily-streak sweepstakes and
  prize experiences to your app with a few lines of code.
version: 3.0.3
homepage: https://sdk.avafli.com
# the repo itself is renamed, and redirects this URL forever afterwards.
repository: https://github.com/AVAFLI/avafli_flutter_sdk

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  shared_preferences: ^2.5.4
  device_info_plus: ">=10.0.0 <14.0.0"
  crypto: ^3.0.7
  url_launcher: ">=6.2.0 <7.0.0"
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # The V2 UI uses Material icon glyphs (close, lock, flame, calendar, …);
  # declaring this here guarantees the MaterialIcons font is bundled even if
  # the host app doesn't set it.
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled V2 design fonts (Inter + Oswald). Consumed inside the SDK via
  # TextStyle(fontFamily: ..., package: 'avafli_sdk').
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-v20-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/inter-v20-latin-500.ttf
          weight: 500
        - asset: assets/fonts/inter-v20-latin-600.ttf
          weight: 600
        - asset: assets/fonts/inter-v20-latin-700.ttf
          weight: 700
        - asset: assets/fonts/inter-v20-latin-800.ttf
          weight: 800
        - asset: assets/fonts/inter-v20-latin-900.ttf
          weight: 900
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald-v57-latin-500.ttf
          weight: 500
        - asset: assets/fonts/oswald-v57-latin-700.ttf
          weight: 700
